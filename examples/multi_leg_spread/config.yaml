strategy:
  name: multi_leg_spread_example
  symbols: [SPREAD_NEAR, SPREAD_FAR]
  timeframe: D1
  market: us_equity
  data_source: synthetic
  account:
    currency: USD
    initial_cash: 100000
  instrument_overrides:
    SPREAD_NEAR:
      data_adapter: ibkr
      instrument_type: spot
      currency: USD
      security_type: STK
    SPREAD_FAR:
      data_adapter: ibkr
      instrument_type: spot
      currency: USD
      security_type: STK
  execution:
    default_fill_price: open
    max_bar_volume_participation_rate: 0.10
  risk:
    max_drawdown_rate: 0.20
    max_gross_exposure: 0.50
    max_net_exposure: 0.25
  cost_overrides:
    multiplier: 1.0
  params:
    lookback: 20
    hedge_ratio: 1.0
    quantity: 10
    entry_zscore: 1.5
    exit_zscore: 0.25
  perf:
    periods_per_year: 252
