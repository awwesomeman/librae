strategy:
  name: sma_crossover_example
  symbol: BTCUSDT  # registered in librae/config/symbols.py (spot, multiplier=1.0 auto)
  timeframe: H1
  initial_balance: 100000
  # broker: binance  # required only for live; never inferred from symbol/data_source
  execution:
    # Backtest/sim: use the next eligible bar's open when a decision does not
    # set fill_price. Live market fills always come from the broker report.
    default_fill_price: open
    # At most 10% of one symbol's bar volume may fill in that bar. Use null
    # only for deliberately unlimited-liquidity research.
    max_bar_volume_participation_rate: 0.10
    # Optional session-level ADV cap. BTCUSDT owns calendar_id="24/7" in the
    # symbol registry, so each UTC date is one session. Both fields are needed:
    # adv_lookback_sessions: 20
    # max_adv_participation_rate: 0.01
    # Optional local live safety timeout. After 120 wall-clock seconds, refresh
    # the broker state, cancel any remainder, retain partial fills, and halt.
    # This is not broker-native IOC/FOK/GTD; null leaves lifetime to the broker.
    live_order_timeout_seconds: 120
  risk:
    # Rate/weight values are ratios, not percentages. Omit/null to disable.
    max_position_weight: 0.30
    max_drawdown_rate: 0.20
    # Absolute account-currency cap for one exposure-increasing open/add.
    # Reductions and exits are never blocked by this guard.
    max_order_notional: 50000
    # Live numeric limit orders must remain within 10% of the latest completed
    # close after broker tick-size normalization. Market orders are unaffected.
    max_limit_price_deviation_rate: 0.10
  perf:
    # H1 24/7 data has 24 * 365 return observations per year.
    periods_per_year: 8760

# Operational runtime settings are top-level and do not change config_hash.
# poll_seconds is required for sim/live; concurrent fetching is opt-in because
# some vendor SDK clients are not thread-safe.
# poll_seconds: 5
# reconciliation_interval_seconds: 300
# market_data_workers: 1
