strategy:
  name: minimum_variance_example
  symbols: [LOW_VOL, MID_VOL, HIGH_VOL]
  timeframe: D1
  market: us_equity
  data_source: synthetic
  account:
    currency: USD
    initial_cash: 100000
  instrument_overrides:
    LOW_VOL:
      data_adapter: ibkr
      instrument_type: spot
      currency: USD
      security_type: STK
    MID_VOL:
      data_adapter: ibkr
      instrument_type: spot
      currency: USD
      security_type: STK
    HIGH_VOL:
      data_adapter: ibkr
      instrument_type: spot
      currency: USD
      security_type: STK
  execution:
    default_fill_price: open
    max_bar_volume_participation_rate: 0.10
  risk:
    max_position_weight: 0.60
    max_drawdown_rate: 0.20
    max_gross_exposure: 1.00
    max_net_exposure: 1.00
  cost_overrides:
    multiplier: 1.0
  params:
    lookback: 20
    rebalance_every: 20
    target_exposure: 0.70
  perf:
    periods_per_year: 252
