# CLI runtime flags：python -m strategies.tw_futures_test.run --help

strategy:
  name: tw_futures_test
  symbol: TMFR1   # 微台 — smallest margin of the three registered tw_futures contracts
  initial_balance: 100000
  timeframe: M1   # fastest Shioaji granularity, minimizes wait for a bar close
