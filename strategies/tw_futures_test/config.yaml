# tw_futures_test — THROWAWAY strategy, not a real trading strategy.
#
# Sole purpose: drive an end-to-end "strategy signal -> LiveTrader ->
# place_order" test against Shioaji's sandbox (see architecture.md's
# "mode vs sandbox" section). Delete this directory once that test is done.
