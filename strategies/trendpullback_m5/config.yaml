# TrendPullback M5 strategy config
# CLI runtime flags：python -m strategies.trendpullback_m5.run --help
# Telegram 通知設定：見 librae/config/notification.py

strategy:
  name: trendpullback_m5
  symbol: BTCUSDT
  market: crypto
  initial_balance: 100000
  timeframe: M5
  data_source: binance_spot
  params:
    periods: 8640
    max_hold_periods: 24
    warmup_periods: 720

  perf:
    risk_free_rate: 0.0
    annual_periods: 365
    ddof: 1
    annualize: true

telegram:
  enabled: true
  notifications:
    status:
      enabled: true
