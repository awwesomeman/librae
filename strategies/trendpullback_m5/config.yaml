# TrendPullback M5 strategy config
# CLI runtime flags：python -m strategies.trendpullback_m5.run --help
# Telegram 通知設定：見 librae/config/notification.py

strategy:
  name: trendpullback_m5
  symbol: BTCUSDT
  market: crypto
  initial_balance: 100000
  timeframe: M5
  params:
    periods: 8640
    max_hold_bars: 24
    warmup_bars: 720

telegram:
  enabled: true
  notifications:
    status:
      enabled: true
