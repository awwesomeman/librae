# TrendPullback H1 strategy config
# CLI runtime flags：python -m strategies.trendpullback.run --help
# Telegram 通知設定：見 librae/config/notification.py

strategy:
  name: trendpullback
  symbol: BTCUSDT
  market: crypto
  initial_balance: 100000
  timeframe: H1
  params:
    periods: 4320
    max_hold_bars: 24
    warmup_periods: 720
    sample: oos

telegram:
  enabled: true
  notifications:
    status:
      enabled: true
      interval_bars: 24
