# TrendPullback H1 strategy config
# CLI runtime flags：python -m strategies.trendpullback.run --help
# Telegram 通知設定：見 librae/config/notification.py

strategy:
  name: trendpullback
  symbol: BTCUSDT
  market: crypto
  initial_balance: 100000
  timeframe: H1
  data_source: binance_spot
  params:
    periods: 4320
    max_hold_periods: 24
    warmup_periods: 720
    sample: oos

  # 績效參數 — 只影響報表呈現，存 DB backtest_runs.perf_params
  perf:
    risk_free_rate: 0.0
    annual_periods: 365
    ddof: 1
    annualize: true

telegram:
  enabled: true
  notifications:
    status:
      enabled: true
      interval_periods: 24
