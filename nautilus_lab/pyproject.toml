[project]
name = "nautilus-multi-market-lab"
version = "0.1.0"
description = "Local multi-market trading lab with NautilusTrader + Shioaji + Binance"
requires-python = ">=3.10"
dependencies = [
  "nautilus_trader",
  "shioaji",
  "ccxt",
  "empyrical",
  "influxdb-client[async]",
  "httpx",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nautilus_lab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
