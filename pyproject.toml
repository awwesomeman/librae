[project]
name = "librae"
dynamic = ["version"]
description = "Librae — quant backtest and live-trading engine, multi-asset support"
readme = "README.md"
authors = [
  { name = "Jason Pan", email = "atk50715@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["quant", "trading", "backtest", "finance", "strategy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/awwesomeman/librae"
Issues = "https://github.com/awwesomeman/librae/issues"

[project.scripts]
librae = "librae._scaffold:main"

[project.optional-dependencies]
analytics = [
  "matplotlib>=3.7",  # trade and signal HTML reports
]
calendars = [
  "exchange-calendars>=4.5",
]
cli = [
  "pyyaml>=6.0",
]
db = [
  "psycopg2-binary>=2.9",  # db/ — optional TimescaleDB read/write integration
]
parquet = [
  "pyarrow>=15",  # optional caller-selected DataFrame serialization backend
]
crypto-live = [
  "ccxt>=4.5.66,<5",  # tested CCXT API family; uv.lock pins the exact repo version
                # declared here as well so `pip install librae[crypto-live]` actually installs it
]
tw-live = [
  # >=1.7, not >=1.5: brokers/shioaji_adapter.py uses StockOrder()/
  # FuturesOrder() (place_order) and api.contracts (_resolve_contract) —
  # the generic Order()/api.Contracts are still present on 1.5.x but emit
  # DeprecationWarning; confirmed against a real 1.7.0 sandbox session
  # 2026-07-26 (see docs/plans/enhance_librae_real_trade.md, section F).
  # 1.5+ itself was required because it moved order enums
  # (Action/FuturesPriceType/StockPriceType/OrderType) from shioaji.order.*
  # to top-level shioaji.* (no 1.4.x was ever released on PyPI, sequence
  # jumps 1.3.3 -> 1.5.0) — caught 2026-07-20 running a real sandbox login.
  "shioaji>=1.7,<2",
]
us-live = [
  "ib-async>=2.1,<3",  # tested ib_async API family; wraps IB Gateway/TWS socket API
]
stocks-data = [
  "httpx>=0.24",  # Binance spot tokenized-stock market data
]
telegram = [
  "httpx>=0.24",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "exchange-calendars>=4.5",
  "httpx>=0.24",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]
viz = [
  "lightweight-charts>=2.0",  # local trade-chart exploration only (librae/backtest/charts.py)
]
dev = [
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["librae*", "brokers*", "db*", "notifications*", "orchestration*", "app*"]

[tool.setuptools.package-data]
librae = ["_scaffold/env.example"]

[tool.setuptools_scm]
# Derives the version from git tags/commit distance instead of a hand-maintained
# string — a `pip install git+...` install (no @<ref> pin) or `pip show librae`
# always reflects the actual commit, no manual version bump to remember/forget.
version_file = "librae/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
  "sdk_contract: offline compatibility checks requiring optional broker SDKs",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["librae", "notifications", "orchestration", "db", "brokers", "app", "scripts"]
extend-exclude = ["*.md", "librae/_version.py"]  # doc code fences; setuptools_scm-generated, gitignored

[tool.ruff.lint]
# Standard rule set: pycodestyle (E/W), pyflakes (F), isort (I), bugbear (B),
# pyupgrade (UP), simplify (SIM), ruff-specific (RUF). No D (pydocstyle) —
# docstrings here are prose/WHY-comments, not Google/NumPy structured.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # line too long — `ruff format` handles wrapping
  "RUF001", "RUF002", "RUF003",  # fire on intentional CJK punctuation in comments
]

[tool.ruff.lint.per-file-ignores]
# Grouped by API area (schema, engine, cost model, strategy types, ...), not
# alphabetical — sorting would scramble the intended reading order.
"librae/__init__.py" = ["I001", "RUF022"]

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"
