[project]
name = "quant-strategy-lab"
version = "0.1.0"
description = "Quant strategy research platform — Librae backtest engine, multi-asset support"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "quantstats>=0.0.62",
  "pandas-ta-classic>=0.1",
  "httpx>=0.24",
  "apscheduler>=3.10,<4",
  "pyyaml>=6.0",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
tw-live = [
  "shioaji>=1.3",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["librae*", "strategies*", "pipeline*", "brokers*", "monitoring*", "db*", "app*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "tw_live: tests requiring shioaji (deselect with: -m 'not tw_live')",
  "nautilus: tests requiring nautilus_trader (deselect with: -m 'not nautilus')",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
