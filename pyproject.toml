[project]
name = "quant-strategy-lab"
version = "0.1.0"
description = "Quant strategy research platform — Librae backtest engine, multi-asset support"
readme = "README.md"
authors = [
  { name = "Jason Pan", email = "atk50715@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["quant", "trading", "backtest", "finance", "strategy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "quantstats>=0.0.62",
  "pandas-ta-classic>=0.1",
  "httpx>=0.24",
  "pyyaml>=6.0",
  "psycopg2-binary>=2.9",
  "pyarrow>=14.0",
  "factrix>=0.17",  # 0.17 is the first version with public factrix.stats.holm_adjusted_p
  "ccxt>=4.0",  # was only lazily imported (brokers/crypto_adapter.py) and never declared
]

[project.urls]
Repository = "https://github.com/awwesomeman/quant-strategy-lab"
Issues = "https://github.com/awwesomeman/quant-strategy-lab/issues"

[project.optional-dependencies]
tw-live = [
  "shioaji>=1.3",
]
research = [
  "yfinance>=0.2",  # only needed for data/regime.py's DXY trend fetch
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["librae*", "strategies*", "pipeline*", "brokers*", "db*", "app*", "data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "tw_live: tests requiring shioaji (deselect with: -m 'not tw_live')",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
