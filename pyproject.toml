[project]
name = "librae"
dynamic = ["version"]
description = "Librae — quant backtest and live-trading engine, multi-asset support"
readme = "README.md"
authors = [
  { name = "Jason Pan", email = "atk50715@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["quant", "trading", "backtest", "finance", "strategy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "quantstats>=0.0.62",
  "httpx>=0.24",  # notifications/telegram.py — small, no heavy transitive deps, not worth its own extra
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/awwesomeman/librae"
Issues = "https://github.com/awwesomeman/librae/issues"

[project.scripts]
librae = "librae._scaffold:main"

[project.optional-dependencies]
db = [
  "psycopg2-binary>=2.9",  # db/ — TimescaleDB read/write; not needed under cfg.no_db=True
]
crypto-live = [
  "ccxt>=4.0",  # brokers/crypto_adapter.py — lazily imported there too (friendly error if missing);
                # declared here as well so `pip install librae[crypto-live]` actually installs it
]
tw-live = [
  # >=1.5, not >=1.4: shioaji's own version sequence jumps 1.3.3 -> 1.5.0
  # (no 1.4.x was ever released on PyPI). 1.5+ moved order enums
  # (Action/FuturesPriceType/StockPriceType/OrderType) from shioaji.order.*
  # to top-level shioaji.* — brokers/shioaji_adapter.py assumes the
  # top-level location (see ERRORS.md). >=1.3 alone let uv.lock resolve to
  # the pre-move 1.3.3 and mask a real AttributeError that only mocked
  # tests couldn't catch — caught 2026-07-20 running a real sandbox login.
  "shioaji>=1.5",
]
us-live = [
  "ib-async>=1.0",  # IBKRAdapter (brokers/ibkr_adapter.py) — wraps IB Gateway/TWS socket API
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
viz = [
  "lightweight-charts>=2.0",  # local trade-chart exploration only (librae/backtest/charts.py)
]
dev = [
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["librae*", "brokers*", "db*", "notifications*", "orchestration*", "app*", "tests*"]

[tool.setuptools.package-data]
librae = ["_scaffold/env.example"]

[tool.setuptools_scm]
# Derives the version from git tags/commit distance instead of a hand-maintained
# string — a `pip install git+...` install (no @<ref> pin) or `pip show librae`
# always reflects the actual commit, no manual version bump to remember/forget.
version_file = "librae/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "tw_live: tests requiring shioaji (deselect with: -m 'not tw_live')",
  "us_live: tests requiring ib_async (deselect with: -m 'not us_live')",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["librae", "notifications", "orchestration", "db", "brokers", "app", "scripts"]
extend-exclude = ["*.md", "librae/_version.py"]  # doc code fences; setuptools_scm-generated, gitignored

[tool.ruff.lint]
# Standard rule set: pycodestyle (E/W), pyflakes (F), isort (I), bugbear (B),
# pyupgrade (UP), simplify (SIM), ruff-specific (RUF). No D (pydocstyle) —
# docstrings here are prose/WHY-comments, not Google/NumPy structured.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # line too long — `ruff format` handles wrapping
  "RUF001", "RUF002", "RUF003",  # fire on intentional CJK punctuation in comments
]

[tool.ruff.lint.per-file-ignores]
# Grouped by API area (schema, engine, cost model, strategy types, ...), not
# alphabetical — sorting would scramble the intended reading order.
"librae/__init__.py" = ["I001", "RUF022"]

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"
