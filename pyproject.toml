[project]
name = "quant-strategy-lab"
version = "0.1.0"
description = "Quant strategy research platform — Librae backtest engine, multi-asset support"
readme = "README.md"
authors = [
  { name = "Jason Pan", email = "atk50715@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["quant", "trading", "backtest", "finance", "strategy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "quantstats>=0.0.62",
  "pandas-ta-classic>=0.1",
  "httpx>=0.24",
  "pyyaml>=6.0",
  "psycopg2-binary>=2.9",
  "pyarrow>=14.0",
  "factrix>=0.17",  # 0.17 is the first version with public factrix.stats.holm_adjusted_p
  "ccxt>=4.0",  # was only lazily imported (brokers/crypto_adapter.py) and never declared
]

[project.urls]
Repository = "https://github.com/awwesomeman/quant-strategy-lab"
Issues = "https://github.com/awwesomeman/quant-strategy-lab/issues"

[project.optional-dependencies]
tw-live = [
  # >=1.5, not >=1.4: shioaji's own version sequence jumps 1.3.3 -> 1.5.0
  # (no 1.4.x was ever released on PyPI). 1.5+ moved order enums
  # (Action/FuturesPriceType/StockPriceType/OrderType) from shioaji.order.*
  # to top-level shioaji.* — brokers/shioaji_adapter.py assumes the
  # top-level location (see ERRORS.md). >=1.3 alone let uv.lock resolve to
  # the pre-move 1.3.3 and mask a real AttributeError that only mocked
  # tests couldn't catch — caught 2026-07-20 running a real sandbox login.
  "shioaji>=1.5",
]
research = [
  "yfinance>=0.2",  # only needed for data/regime.py's DXY trend fetch
  "xlrd>=2.0",  # only needed for providers/nyfed.py's GSCPI .xls parse (legacy binary format, not modern .xlsx)
  "scikit-learn>=1.4",  # multi-factor composite signal models (e.g. strategies/experiments/btc_4h_multifactor)
]
us-live = [
  "ib-async>=1.0",  # IBKRAdapter (brokers/ibkr_adapter.py) — wraps IB Gateway/TWS socket API
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["librae*", "strategies*", "brokers*", "db*", "app*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "tw_live: tests requiring shioaji (deselect with: -m 'not tw_live')",
  "us_live: tests requiring ib_async (deselect with: -m 'not us_live')",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
