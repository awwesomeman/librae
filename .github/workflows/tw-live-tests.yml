name: tw-live-tests

on:
  push:
    paths:
      - "librae/**"
      - "brokers/**"
      - "db/**"
      - "tests/**"
      - "pyproject.toml"
      - "conftest.py"
      - ".github/workflows/tw-live-tests.yml"
  pull_request:
    paths:
      - "librae/**"
      - "brokers/**"
      - "db/**"
      - "tests/**"
      - "pyproject.toml"
      - "conftest.py"
      - ".github/workflows/tw-live-tests.yml"

jobs:
  tw-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tw-live + test dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tw-live,test]"

      - name: Run tw-live tests
        if: steps.install.outcome == 'success'
        run: |
          pytest -q -m "tw_live" tests/
