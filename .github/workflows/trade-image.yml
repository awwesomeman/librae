name: trade-image

on:
  push:
    branches:
      - main
    paths:
      - "deploy/**"
      - "librae/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/trade-image.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "librae/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/trade-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment scripts
        run: bash -n deploy/build_push.sh deploy/cloud_deploy.sh deploy/trade.sh

      - name: Enable multi-platform builds
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v4

      - name: Configure Buildx for the disposable registry
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Start disposable registry
        run: |
          docker network create deployment-acceptance
          docker run --detach \
            --name deployment-registry \
            --network deployment-acceptance \
            --publish 127.0.0.1:5000:5000 \
            registry:2.8.3
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null && exit 0
            sleep 1
          done
          echo "Disposable registry did not become ready." >&2
          exit 1

      - name: Prepare strategy fixture
        run: |
          mkdir -p ../strategy-fixture/smoke
          touch ../strategy-fixture/smoke/__init__.py
          cat > ../strategy-fixture/smoke/run.py <<'PY'
          import argparse
          import os
          import signal
          import time
          from pathlib import Path
          from uuid import uuid4

          parser = argparse.ArgumentParser()
          parser.add_argument("--mode")
          parser.add_argument("--poll-seconds")
          parser.add_argument("--config")
          parser.add_argument("--runtime-revision")
          parser.add_argument("--once", action="store_true")
          options = parser.parse_args()
          if options.once:
              raise SystemExit(0)

          running = True

          def stop(*_args):
              global running
              running = False

          def halt(*_args):
              Path("/tmp/librae-halt-requested").write_text("SIGUSR1\n", encoding="utf-8")

          def reset(*_args):
              Path("/tmp/librae-reset-requested").write_text("SIGUSR2\n", encoding="utf-8")

          signal.signal(signal.SIGTERM, stop)
          signal.signal(signal.SIGINT, stop)
          signal.signal(signal.SIGUSR1, halt)
          signal.signal(signal.SIGUSR2, reset)
          # After a crash CI holds readiness, so it can check the restarted
          # container is not ready until this process writes its marker.
          restarted = Path("/tmp/librae-restarted")
          release = Path("/tmp/librae-release-ready")
          while restarted.exists() and not release.exists():
              time.sleep(0.1)
          restarted.unlink(missing_ok=True)
          release.unlink(missing_ok=True)
          marker = ":".join(
              (
                  os.environ["LIBRAE_READY_TOKEN"],
                  "fixture-run",
                  uuid4().hex,
              )
          )
          Path(os.environ["LIBRAE_READY_FILE"]).write_text(f"{marker}\n", encoding="utf-8")
          crash = Path("/tmp/librae-crash-requested")
          while running:
              if crash.exists():
                  crash.unlink()
                  restarted.touch()
                  raise SystemExit(1)
              time.sleep(0.1)
          PY
          printf '%s\n' \
            'strategy:' \
            '  symbol: MU' \
            '  timeframe: D1' \
            '  account:' \
            '    account_id: ci' \
            '    currency: USD' \
            '    initial_cash: 100000' \
            > ../strategy-fixture/smoke/config.yaml
          mkdir -p ../strategy-fixture/failing
          touch ../strategy-fixture/failing/__init__.py
          printf '%s\n' 'raise SystemExit(3)' > ../strategy-fixture/failing/run.py
          printf '%s\n' \
            'strategy:' \
            '  symbol: MU' \
            '  timeframe: D1' \
            '  account:' \
            '    account_id: ci-fail' \
            '    currency: USD' \
            '    initial_cash: 100000' \
            > ../strategy-fixture/failing/config.yaml

      - name: Publish acceptance image with build_push.sh
        id: image
        env:
          TRADE_IMAGE: localhost:5000/librae-trade
          TRADE_STRATEGY_PATH: ../strategy-fixture
          TRADE_PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          UV_CONFIG_FILE: ${{ runner.temp }}/uv.toml
        run: |
          set -o pipefail
          printf '%s\n' 'index-url = "https://pypi.org/simple"' > "${UV_CONFIG_FILE}"
          revision="$(git rev-parse --verify HEAD)"
          version="0+g${revision:0:12}"
          ./deploy/build_push.sh | tee "${RUNNER_TEMP}/build-push.log"
          image_ref="$(
            sed -n 's/^TRADE_IMAGE_REF=//p' "${RUNNER_TEMP}/build-push.log"
          )"
          if [[ ! "${image_ref}" =~ ^localhost:5000/librae-trade@sha256:[0-9a-f]{64}$ ]]; then
            echo "build_push.sh emitted an invalid image reference: ${image_ref}" >&2
            exit 1
          fi
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Pull immutable image and verify identity
        env:
          EXPECTED_REVISION: ${{ steps.image.outputs.revision }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
          TRADE_IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker pull "${TRADE_IMAGE_REF}"
          docker tag "${TRADE_IMAGE_REF}" librae-trade:ci
          actual_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${TRADE_IMAGE_REF}"
          )"
          test "${actual_revision}" = "${EXPECTED_REVISION}"
          docker run --rm \
            --env EXPECTED_VERSION="${EXPECTED_VERSION}" \
            "${TRADE_IMAGE_REF}" \
            python -c \
            'import importlib.metadata as m, os; import librae; assert m.version("librae") == os.environ["EXPECTED_VERSION"]'
          docker run --rm --interactive "${TRADE_IMAGE_REF}" python - <<'PY'
          import importlib.metadata
          import tomllib
          from pathlib import Path

          distribution_names = (
              "numpy",
              "pandas",
              "exchange-calendars",
              "PyYAML",
              "psycopg2-binary",
              "ccxt",
              "httpx",
              "shioaji",
              "ib-async",
          )
          with Path("/app/uv.lock").open("rb") as lock_file:
              lock = tomllib.load(lock_file)

          locked_versions = {}
          for package in lock["package"]:
              package_version = package.get("version")
              if package_version is not None:
                  locked_versions.setdefault(package["name"], set()).add(package_version)

          for distribution_name in distribution_names:
              normalized_name = distribution_name.lower()
              installed_version = importlib.metadata.version(distribution_name)
              selected_versions = locked_versions.get(normalized_name, set())
              if installed_version not in selected_versions:
                  raise SystemExit(
                      f"{distribution_name}=={installed_version} is not selected by uv.lock "
                      f"(expected one of {sorted(selected_versions)})"
                  )
              print(f"{distribution_name}=={installed_version}")
          PY
          docker run --rm "${TRADE_IMAGE_REF}" python -m strategies.smoke.run --once

      - name: Write CI .env.secrets
        run: |
          printf '%s\n' \
            'POSTGRES_PASSWORD=quant_secret' \
            'POSTGRES_APP_PASSWORD=quant_app_secret' \
            'POSTGRES_GRAFANA_PASSWORD=grafana_reader_secret' \
            'GF_SECURITY_ADMIN_PASSWORD=admin' \
            'TIMESCALE_DSN=postgresql://quant_app:quant_app_secret@localhost:5432/quant' \
            'TRADE_TIMESCALE_DSN=postgresql://quant_app:quant_app_secret@quant_timescaledb:5432/quant' \
            > .env.secrets

      - name: Verify TimescaleDB container endpoint
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          docker compose \
            --env-file .env.example \
            --env-file .env.secrets \
            --file deploy/docker-compose.yml \
            up --detach timescaledb
          connected=false
          for attempt in $(seq 1 60); do
            if docker run --rm \
              --network quant_network \
              --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
              librae-trade:ci \
              python -c \
              'import os, psycopg2; connection = psycopg2.connect(os.environ["TIMESCALE_DSN"]); cursor = connection.cursor(); cursor.execute("SELECT 1"); assert cursor.fetchone() == (1,); connection.close()'; then
              connected=true
              break
            fi
            sleep 1
          done
          test "${connected}" = true

      - name: Verify account-specific trade launch
        env:
          TRADE_IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          ./deploy/trade.sh start smoke-ci ci USD smoke sim 60
          test "$(
            docker inspect \
              --format '{{ index .Config.Labels "io.librae.deployment_id" }}' \
              quant_smoke-ci
          )" = "smoke-ci"
          test "$(
            docker inspect \
              --format '{{ index .Config.Labels "io.librae.account_id" }}' \
              quant_smoke-ci
          )" = "ci"
          test "$(
            docker inspect \
              --format '{{ index .Config.Labels "io.librae.currency" }}' \
              quant_smoke-ci
          )" = "USD"
          test "$(
            docker inspect \
              --format '{{.Config.Image}}' \
              quant_smoke-ci
          )" = "${TRADE_IMAGE_REF}"
          ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=running"
          ./deploy/trade.sh halt smoke-ci
          for attempt in $(seq 1 10); do
            docker exec quant_smoke-ci test -f /tmp/librae-halt-requested && break
            sleep 1
          done
          docker exec quant_smoke-ci test -f /tmp/librae-halt-requested
          ./deploy/trade.sh reset smoke-ci
          for attempt in $(seq 1 10); do
            docker exec quant_smoke-ci test -f /tmp/librae-reset-requested && break
            sleep 1
          done
          docker exec quant_smoke-ci test -f /tmp/librae-reset-requested
          ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=running"
          # Crash the halted runner: the restart policy must still restart it,
          # and the restarted container must not read ready before its runner.
          docker exec quant_smoke-ci rm /tmp/librae-halt-requested
          docker exec quant_smoke-ci touch /tmp/librae-crash-requested
          for attempt in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' quant_smoke-ci)"
            [[ "${state}" == "running 1" ]] && break
            sleep 1
          done
          if [[ "${state}" != "running 1" ]]; then
            echo "halted runner was not restarted after a crash (${state})" >&2
            exit 1
          fi
          ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=failed"
          if ./deploy/trade.sh halt smoke-ci; then
            echo "halt signalled a restarted runner before it was ready" >&2
            exit 1
          fi
          docker exec quant_smoke-ci test ! -e /tmp/librae-halt-requested
          docker exec quant_smoke-ci touch /tmp/librae-release-ready
          for attempt in $(seq 1 30); do
            ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=running" >/dev/null && break
            sleep 1
          done
          ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=running"
          # Crash the runner between halt's readiness check and its signal:
          # the restarted runner must not be signalled, and halt must say so.
          real_docker="$(command -v docker)"
          mkdir -p "${RUNNER_TEMP}/crash-before-signal"
          cat > "${RUNNER_TEMP}/crash-before-signal/docker" <<SHIM
          #!/usr/bin/env bash
          if [[ "\$1" == exec && "\$*" == *SIGUSR1* ]]; then
            "${real_docker}" exec quant_smoke-ci touch /tmp/librae-crash-requested
            for attempt in \$(seq 1 150); do
              [[ "\$("${real_docker}" inspect --format '{{.State.Status}} {{.RestartCount}}' quant_smoke-ci)" == "running 2" ]] && break
              sleep 0.2
            done
          fi
          exec "${real_docker}" "\$@"
          SHIM
          chmod +x "${RUNNER_TEMP}/crash-before-signal/docker"
          if PATH="${RUNNER_TEMP}/crash-before-signal:${PATH}" \
            ./deploy/trade.sh halt smoke-ci 2> "${RUNNER_TEMP}/halt.err"; then
            echo "halt reported a signal to a runner that restarted before it" >&2
            exit 1
          fi
          grep -F "nothing was signalled" "${RUNNER_TEMP}/halt.err"
          test "$(docker inspect --format '{{.RestartCount}}' quant_smoke-ci)" = "2"
          docker exec quant_smoke-ci test ! -e /tmp/librae-halt-requested
          docker exec quant_smoke-ci touch /tmp/librae-release-ready
          for attempt in $(seq 1 30); do
            ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=running" >/dev/null && break
            sleep 1
          done
          ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=running"
          ./deploy/trade.sh restart smoke-ci | grep -Fx "phase=running"
          if ./deploy/trade.sh start failing-ci ci-fail USD failing sim 60; then
            echo "early-exit deployment was reported ready" >&2
            exit 1
          fi
          ./deploy/trade.sh inspect failing-ci | grep -Fx "phase=failed"
          ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=running"
          docker rm --force quant_failing-ci
          ./deploy/trade.sh stop smoke-ci
          ./deploy/trade.sh inspect smoke-ci | grep -Fx "phase=stopped"
          docker rm quant_smoke-ci

      - name: Verify durable account ownership across containers
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          docker run --detach \
            --name librae-account-lease-owner \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python -c \
            'import time; from librae.db.timescale_state import TimescaleLiveStateStore; store = TimescaleLiveStateStore(); assert store.acquire_lease("live-account:shared"); print("lease-ready", flush=True); time.sleep(60)'
          for attempt in $(seq 1 30); do
            docker logs librae-account-lease-owner 2>&1 | grep -q lease-ready && break
            sleep 1
          done
          docker logs librae-account-lease-owner 2>&1 | grep -q lease-ready
          docker run --rm \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python -c \
            'from librae.db.timescale_state import TimescaleLiveStateStore; assert not TimescaleLiveStateStore().acquire_lease("live-account:shared")'
          docker rm --force librae-account-lease-owner

      - name: Verify backtest cache schema
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          docker run --rm --interactive \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python - <<'PY'
          import os

          import psycopg2

          connection = psycopg2.connect(os.environ["TIMESCALE_DSN"])
          cursor = connection.cursor()
          rows = [
              ("cache-run-a", "config-a", "revision-a", "cache-a"),
              ("cache-run-b", "config-a", "revision-b", "cache-b"),
          ]
          for run_id, config_hash, revision, cache_key in rows:
              cursor.execute(
                  """
                  INSERT INTO backtest_runs
                      (run_id, strategy_name, symbols, timeframe, primary_subscriptions, config_hash,
                       backtest_revision, backtest_cache_key)
                  VALUES (%s, 'smoke', '["MU"]', 'D1',
                          '[{"symbol":"MU","timeframe":"D1","calendar_id":"XNYS","session_mode":"extended","data_source":"ibkr","instrument_type":"spot"}]',
                          %s, %s, %s)
                  """,
                  (run_id, config_hash, revision, cache_key),
              )
          connection.commit()

          try:
              cursor.execute(
                  """
                  INSERT INTO backtest_runs
                      (run_id, strategy_name, symbols, timeframe, primary_subscriptions, config_hash,
                       backtest_revision, backtest_cache_key)
                  VALUES ('cache-run-c', 'smoke', '["MU"]', 'D1',
                          '[{"symbol":"MU","timeframe":"D1","calendar_id":"XNYS","session_mode":"extended","data_source":"ibkr","instrument_type":"spot"}]',
                          'config-b', 'revision-c', 'cache-a')
                  """
              )
              connection.commit()
          except psycopg2.errors.UniqueViolation:
              connection.rollback()
          else:
              raise AssertionError("duplicate backtest_cache_key was accepted")
          finally:
              cursor.close()
              connection.close()
          PY

      - name: Verify run bars keep each version once
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          docker run --rm --interactive \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python - <<'PY'
          import json
          import os

          import pandas as pd
          import psycopg2

          from librae.core.market_data import MarketDataSubscription
          from librae.db.timescale_reader import load_run_bars
          from librae.db.timescale_writer import write_run_bars

          run_id = "run-bars-smoke"
          subscription = MarketDataSubscription(
              symbol="RUN_BARS_SMOKE",
              timeframe="H1",
              calendar_id="24/7",
              session_mode="extended",
              data_source="fixture",
              instrument_type="spot",
          )
          connection = psycopg2.connect(os.environ["TIMESCALE_DSN"])
          cursor = connection.cursor()
          try:
              cursor.execute("DELETE FROM backtest_runs WHERE run_id = %s", (run_id,))
              cursor.execute(
                  """
                  INSERT INTO backtest_runs
                      (run_id, strategy_name, symbols, timeframe, primary_subscriptions)
                  VALUES (%s, 'run-bars-smoke', %s::jsonb, 'H1', %s::jsonb)
                  """,
                  (
                      run_id,
                      json.dumps([subscription.symbol]),
                      json.dumps([subscription.to_dict()]),
                  ),
              )
              connection.commit()

              def version(close, available_at, observed_at):
                  return pd.DataFrame(
                      {
                          "open": [close],
                          "high": [close + 1],
                          "low": [close - 1],
                          "close": [close],
                          "volume": [10.0],
                          "available_at": [pd.Timestamp(available_at)],
                          "observed_at": [pd.Timestamp(observed_at)],
                      },
                      index=pd.DatetimeIndex(
                          [pd.Timestamp("2026-08-01T00:00:00Z")],
                          name="ts",
                      ),
                  )

              first = version(101.0, "2026-08-01T01:00:00Z", "2026-08-01T01:00:05Z")
              replay = version(101.0, "2026-08-01T01:00:00Z", "2026-08-01T04:00:00Z")
              correction = version(103.0, "2026-08-01T03:00:00Z", "2026-08-01T03:00:02Z")
              # Revised values under the calendar-derived available_at, as a
              # restarted run re-reads them.
              revised = version(102.0, "2026-08-01T01:00:00Z", "2026-08-01T06:00:00Z")
              assert write_run_bars(run_id, subscription, first) == 1
              assert write_run_bars(run_id, subscription, replay) == 0
              assert write_run_bars(run_id, subscription, correction) == 1
              assert write_run_bars(run_id, subscription, revised) == 1

              cursor.execute(
                  "SELECT close, observed_at FROM run_bars WHERE run_id = %s ORDER BY observed_at",
                  (run_id,),
              )
              stored = [(close, pd.Timestamp(observed_at)) for close, observed_at in cursor.fetchall()]
              assert stored == [
                  (101.0, pd.Timestamp("2026-08-01T01:00:05Z")),
                  (103.0, pd.Timestamp("2026-08-01T03:00:02Z")),
                  (102.0, pd.Timestamp("2026-08-01T06:00:00Z")),
              ], stored
              assert load_run_bars(run_id)["close"].tolist() == [102.0]
          finally:
              connection.rollback()
              cursor.execute("DELETE FROM backtest_runs WHERE run_id = %s", (run_id,))
              connection.commit()
              cursor.execute("SELECT count(*) FROM run_bars WHERE run_id = %s", (run_id,))
              assert cursor.fetchone()[0] == 0, "run_bars must cascade with its run"
              cursor.close()
              connection.close()
          PY

      - name: Verify backtest saves leave engine runs alone
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          docker run --rm --interactive \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python - <<'PY'
          import os

          import pandas as pd
          import psycopg2

          from librae.core.market_data import MarketDataSubscription
          from librae.core.run_config import AccountConfig, RunConfig
          from librae.db.timescale_writer import save_signal_results, write_run_bars, write_run_metadata

          subscription = MarketDataSubscription(
              symbol="BTCUSDT",
              timeframe="H1",
              calendar_id="24/7",
              session_mode="extended",
              data_source="binance_spot",
              instrument_type="spot",
          )
          index = pd.date_range("2026-08-01T00:00:00Z", periods=3, freq="h", name="ts")
          frame = pd.DataFrame(
              {"open": 100.0, "high": 101.0, "low": 99.0, "close": 100.0, "volume": 10.0},
              index=index,
          ).assign(entry_signal=[1.0, 0.0, -1.0])
          config = RunConfig(
              strategy_name="save-guard-smoke",
              symbols=["BTCUSDT"],
              timeframe="H1",
              market="crypto",
              data_source="binance_spot",
              account=AccountConfig(currency="USDT", initial_cash=10_000.0),
              mode="backtest",
          )
          sim_run = "save-guard-sim"
          runs = (sim_run, "save-guard-a", "save-guard-b")
          connection = psycopg2.connect(os.environ["TIMESCALE_DSN"])
          cursor = connection.cursor()


          def count(table, run_id):
              cursor.execute(f"SELECT count(*) FROM {table} WHERE run_id = %s", (run_id,))
              return cursor.fetchone()[0]


          def save(run_id, **kwargs):
              return save_signal_results(
                  frame,
                  "BTCUSDT",
                  "H1",
                  "save-guard-smoke",
                  "binance_spot",
                  run_id=run_id,
                  config=config,
                  **kwargs,
              )


          try:
              write_run_metadata(
                  sim_run,
                  "save-guard-smoke",
                  ["BTCUSDT"],
                  "H1",
                  "sim",
                  data_source="binance_spot",
                  primary_subscriptions=(subscription,),
              )
              assert write_run_bars(sim_run, subscription, frame.drop(columns="entry_signal")) == 3

              # A backtest save must not take over, clear or relabel an engine's run.
              # The backtest save reaches the database and is refused by the
              # mode in the run's identity; the sim save is refused up front.
              refusals = {"backtest": "different immutable identity", "sim": "stores backtest runs"}
              for mode, refusal in refusals.items():
                  try:
                      save(sim_run, mode=mode, store_bars=True)
                  except ValueError as error:
                      assert refusal in str(error), error
                  else:
                      raise AssertionError(f"a {mode} save onto a sim run was accepted")
              cursor.execute("SELECT mode FROM backtest_runs WHERE run_id = %s", (sim_run,))
              assert cursor.fetchone() == ("sim",)
              assert count("run_bars", sim_run) == 3

              # Replacing a canonical run leaves none of its rows behind, including the
              # signal_events no foreign key cascades.
              assert save("save-guard-a", backtest_revision="r1", store_bars=True)["signal_events"] == 2
              assert save("save-guard-b", backtest_revision="r1", replace_existing=True)["signal_events"] == 2
              assert count("backtest_runs", "save-guard-a") == 0
              assert count("signal_events", "save-guard-a") == 0
              assert count("run_bars", "save-guard-a") == 0
          finally:
              connection.rollback()
              for run_id in runs:
                  cursor.execute("DELETE FROM signal_events WHERE run_id = %s", (run_id,))
                  cursor.execute("DELETE FROM backtest_runs WHERE run_id = %s", (run_id,))
              connection.commit()
              cursor.close()
              connection.close()
          PY

      - name: Verify backtest replacement leaves no rows behind
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          docker run --rm --interactive \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python - <<'PY'
          import os
          from datetime import UTC, datetime

          import numpy as np
          import pandas as pd
          import psycopg2

          from librae.backtest.schema import (
              AccountPerformance,
              BacktestOutput,
              PositionEventRecord,
              RunMetadata,
              StrategyMetrics,
          )
          from librae.core.market_data import MarketDataSubscription
          from librae.db.timescale_writer import save_backtest_output

          subscription = MarketDataSubscription(
              symbol="BTCUSDT",
              timeframe="H1",
              calendar_id="24/7",
              session_mode="extended",
              data_source="binance_spot",
              instrument_type="spot",
          )
          start = datetime(2026, 8, 1, tzinfo=UTC)
          index = pd.date_range(start, periods=3, freq="h", name="ts")
          bars = pd.DataFrame(
              {"open": 100.0, "high": 101.0, "low": 99.0, "close": 100.0, "volume": 10.0},
              index=index,
          )
          runs = {
              name: f"replace-smoke-20260801t0000-{suffix}"
              for name, suffix in (("a", "aaaaaa"), ("b", "bbbbbb"), ("c", "cccccc"))
          }


          def output(run_id, event_ids):
              events = tuple(
                  PositionEventRecord(
                      event_id=event_id,
                      ts=start,
                      account_id="main",
                      currency="USDT",
                      symbol="BTCUSDT",
                      side="long",
                      event_type="open",
                      fill_quantity=1.0,
                      price=100.0,
                      entry_price=100.0,
                      remaining_quantity=1.0,
                      notional=100.0,
                  )
                  for event_id in event_ids
              )
              return BacktestOutput(
                  run_metadata=RunMetadata(
                      run_id=run_id,
                      strategy_name="replace-smoke",
                      symbols=("BTCUSDT",),
                      timeframe="H1",
                      data_source="binance_spot",
                      started_at=start,
                      ended_at=start,
                      run_at=start,
                      primary_subscriptions=(subscription,),
                  ),
                  account=AccountPerformance(
                      account_id="main",
                      currency="USDT",
                      initial_cash=10_000.0,
                      final_equity=10_000.0,
                      net_pnl=0.0,
                      equity_curve=(),
                      metrics=StrategyMetrics(total_return=0.0),
                  ),
                  position_events=events,
                  position_snapshots=(),
                  allocation_snapshots=(),
              )


          def save(run_id, event_ids, frame=bars, **kwargs):
              return save_backtest_output(
                  output(run_id, event_ids),
                  config_hash="replace-smoke-config",
                  backtest_revision="r1",
                  bars_by_symbol={"BTCUSDT": frame},
                  **kwargs,
              )


          connection = psycopg2.connect(os.environ["TIMESCALE_DSN"])
          cursor = connection.cursor()


          def count(table, run_id):
              cursor.execute(f"SELECT count(*) FROM {table} WHERE run_id = %s", (run_id,))
              return cursor.fetchone()[0]


          def event_ids(run_id):
              cursor.execute(
                  "SELECT event_id FROM position_events WHERE run_id = %s ORDER BY event_id", (run_id,)
              )
              return [row[0] for row in cursor.fetchall()]


          try:
              assert save(runs["a"], ["a-open"])["position_events"] == 1
              assert event_ids(runs["a"]) == ["a-open"]

              # Replacing a run leaves none of its rows behind, including the
              # position_events no foreign key cascades.
              assert save(runs["b"], ["b-open"], replace_existing=True)["position_events"] == 1
              assert count("backtest_runs", runs["a"]) == 0
              assert event_ids(runs["a"]) == []
              assert count("run_bars", runs["a"]) == 0
              assert event_ids(runs["b"]) == ["b-open"]

              # Saving the same run again replaces its events too.
              assert save(runs["b"], ["b-reopen"])["position_events"] == 1
              assert event_ids(runs["b"]) == ["b-reopen"]
              assert count("run_bars", runs["b"]) == 3

              # A replacement whose bars are refused rolls back whole: the run it would
              # have replaced keeps every row, and the refused run leaves none.
              for column in (["close"], list(bars.columns)):
                  broken = bars.copy()
                  broken.loc[index[1], column] = np.nan
                  try:
                      save(runs["c"], ["c-open"], frame=broken, replace_existing=True)
                  except ValueError as error:
                      assert "finite" in str(error), error
                  else:
                      raise AssertionError(f"bars with a NaN {column} were saved")
                  connection.rollback()
                  assert count("backtest_runs", runs["b"]) == 1
                  assert event_ids(runs["b"]) == ["b-reopen"]
                  assert count("run_bars", runs["b"]) == 3
                  assert count("backtest_runs", runs["c"]) == 0
                  assert event_ids(runs["c"]) == []
                  assert count("run_bars", runs["c"]) == 0
          finally:
              connection.rollback()
              for run_id in runs.values():
                  cursor.execute("DELETE FROM position_events WHERE run_id = %s", (run_id,))
                  cursor.execute("DELETE FROM backtest_runs WHERE run_id = %s", (run_id,))
              connection.commit()
              cursor.close()
              connection.close()
          PY

      - name: Verify a restored run keeps its KPIs
        run: |
          set -a
          source .env.example
          source .env.secrets
          set +a
          docker run --rm --interactive \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python - <<'PY'
          import os

          import psycopg2

          from librae.backtest.schema import StrategyMetrics
          from librae.config.symbols import resolve_symbol
          from librae.core.run_config import AccountConfig, RunConfig
          from librae.db.timescale_writer import write_strategy_performance
          from librae.orchestration.live import _TimescaleCallbacks

          run_id = "reregister-smoke"
          config = RunConfig(
              strategy_name="reregister-smoke",
              symbols=["BTCUSDT"],
              timeframe="H1",
              market="crypto",
              data_source="binance_spot",
              account=AccountConfig(currency="USDT", initial_cash=10_000.0),
              mode="sim",
          )
          callbacks = _TimescaleCallbacks(config, {"BTCUSDT": resolve_symbol(config, "BTCUSDT")}, None)
          connection = psycopg2.connect(os.environ["TIMESCALE_DSN"])
          cursor = connection.cursor()


          def performance():
              cursor.execute(
                  "SELECT final_equity, net_pnl, total_return, trades FROM strategy_performance WHERE run_id = %s",
                  (run_id,),
              )
              return cursor.fetchall()


          try:
              callbacks.register_run(run_id)
              assert performance() == [(10_000.0, 0.0, 0.0, 0)], performance()

              # The KPIs a run has computed by the time it restarts.
              write_strategy_performance(
                  run_id,
                  config.account_id,
                  "USDT",
                  10_000.0,
                  10_250.0,
                  250.0,
                  StrategyMetrics(total_return=0.025, max_drawdown=0.01, trades=250),
              )
              connection.commit()
              kept = performance()
              assert kept == [(10_250.0, 250.0, 0.025, 250)], kept

              # A restored run registers again and must keep them.
              callbacks.register_run(run_id)
              connection.commit()
              assert performance() == kept, performance()
          finally:
              connection.rollback()
              cursor.execute("DELETE FROM backtest_runs WHERE run_id = %s", (run_id,))
              connection.commit()
              cursor.execute("SELECT count(*) FROM strategy_performance WHERE run_id = %s", (run_id,))
              assert cursor.fetchone()[0] == 0, "strategy_performance must cascade with its run"
              cursor.close()
              connection.close()
          PY

      - name: Verify Linux host-gateway routing
        run: |
          python3 -m http.server 17497 --bind 0.0.0.0 >/tmp/fake-broker.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          until curl --fail --silent http://127.0.0.1:17497 >/dev/null; do
