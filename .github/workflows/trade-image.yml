name: trade-image

on:
  push:
    paths:
      - "deploy/**"
      - "librae/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/trade-image.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "librae/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/trade-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare strategy fixture
        run: |
          mkdir -p ../strategies/smoke
          touch ../strategies/__init__.py ../strategies/smoke/__init__.py
          printf '%s\n' 'print("strategy fixture ready")' > ../strategies/smoke/run.py

      - name: Build clean trade image
        id: image
        run: |
          revision="$(git rev-parse --verify HEAD)"
          version="0+g${revision:0:12}"
          docker build \
            --build-arg LIBRAE_VERSION="${version}" \
            --build-arg LIBRAE_REVISION="${revision}" \
            --tag librae-trade:ci \
            --file deploy/Dockerfile \
            ..
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify package and image identity
        env:
          EXPECTED_REVISION: ${{ steps.image.outputs.revision }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: |
          actual_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              librae-trade:ci
          )"
          test "${actual_revision}" = "${EXPECTED_REVISION}"
          docker run --rm \
            --env EXPECTED_VERSION="${EXPECTED_VERSION}" \
            librae-trade:ci \
            python -c \
            'import importlib.metadata as m, os; import librae; assert m.version("librae") == os.environ["EXPECTED_VERSION"]'
          docker run --rm librae-trade:ci python -m strategies.smoke.run

      - name: Verify TimescaleDB container endpoint
        run: |
          set -a
          source .env.example
          set +a
          docker compose \
            --env-file .env.example \
            --file deploy/docker-compose.yml \
            up --detach timescaledb
          connected=false
          for attempt in $(seq 1 60); do
            if docker run --rm \
              --network quant_network \
              --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
              librae-trade:ci \
              python -c \
              'import os, psycopg2; connection = psycopg2.connect(os.environ["TIMESCALE_DSN"]); cursor = connection.cursor(); cursor.execute("SELECT 1"); assert cursor.fetchone() == (1,); connection.close()'; then
              connected=true
              break
            fi
            sleep 1
          done
          test "${connected}" = true

      - name: Verify backtest cache schema
        run: |
          set -a
          source .env.example
          set +a
          docker run --rm --interactive \
            --network quant_network \
            --env TIMESCALE_DSN="${TRADE_TIMESCALE_DSN}" \
            librae-trade:ci \
            python - <<'PY'
          import os

          import psycopg2

          connection = psycopg2.connect(os.environ["TIMESCALE_DSN"])
          cursor = connection.cursor()
          rows = [
              ("cache-run-a", "config-a", "revision-a", "cache-a"),
              ("cache-run-b", "config-a", "revision-b", "cache-b"),
          ]
          for run_id, config_hash, revision, cache_key in rows:
              cursor.execute(
                  """
                  INSERT INTO backtest_runs
                      (run_id, strategy, symbols, timeframe, config_hash,
                       backtest_revision, backtest_cache_key)
                  VALUES (%s, 'smoke', '["MU"]', 'D1', %s, %s, %s)
                  """,
                  (run_id, config_hash, revision, cache_key),
              )
          connection.commit()

          try:
              cursor.execute(
                  """
                  INSERT INTO backtest_runs
                      (run_id, strategy, symbols, timeframe, config_hash,
                       backtest_revision, backtest_cache_key)
                  VALUES ('cache-run-c', 'smoke', '["MU"]', 'D1',
                          'config-b', 'revision-c', 'cache-a')
                  """
              )
              connection.commit()
          except psycopg2.errors.UniqueViolation:
              connection.rollback()
          else:
              raise AssertionError("duplicate backtest_cache_key was accepted")
          finally:
              cursor.close()
              connection.close()
          PY

      - name: Verify Linux host-gateway routing
        run: |
          python3 -m http.server 17497 --bind 0.0.0.0 >/tmp/fake-broker.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          until curl --fail --silent http://127.0.0.1:17497 >/dev/null; do
            sleep 1
          done
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            librae-trade:ci \
            python -c \
            'from urllib.request import urlopen; assert urlopen("http://host.docker.internal:17497", timeout=5).status == 200'

      - name: Stop integration services
        if: always()
        run: |
          docker compose \
            --env-file .env.example \
            --file deploy/docker-compose.yml \
            down --volumes
