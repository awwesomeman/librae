name: core-tests

on:
  push:
    branches:
      - main
    paths:
      - "librae/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/conftest.py"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "librae/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/conftest.py"
      - ".github/workflows/core-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install core + test dependencies
        run: uv sync --frozen --python ${{ matrix.python }} --extra test --extra db

      - name: Run offline tests
        run: uv run --python ${{ matrix.python }} pytest -q -m "not sdk_contract" tests/
