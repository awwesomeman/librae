name: core-tests

on:
  push:
    paths:
      - "librae/**"
      - "notifications/**"
      - "orchestration/**"
      - "db/**"
      - "brokers/**"
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/conftest.py"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "librae/**"
      - "notifications/**"
      - "orchestration/**"
      - "db/**"
      - "brokers/**"
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/conftest.py"
      - ".github/workflows/core-tests.yml"

jobs:
  core:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install core + test dependencies
        run: uv sync --frozen --python ${{ matrix.python }} --extra test --extra db --extra crypto-live

      - name: Run core tests (skip tw-live/us-live)
        run: uv run --python ${{ matrix.python }} pytest -q -m "not tw_live and not us_live" tests/
