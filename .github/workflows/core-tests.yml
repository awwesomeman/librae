name: core-tests

on:
  push:
    paths:
      - "librae/**"
      - "strategies/**"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "conftest.py"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "librae/**"
      - "strategies/**"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "conftest.py"
      - ".github/workflows/core-tests.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run core tests (skip tw-live)
        run: |
          pytest -q -m "not tw_live" tests/
