name: package-smoke

on:
  push:
    branches:
      - main
    paths:
      - "librae/**"
      - "examples/**"
      - "tests/packaging/**"
      - "tests/examples/**"
      - "tests/deploy/test_deploy_contract.py"
      - "pyproject.toml"
      - ".github/workflows/package-smoke.yml"
  pull_request:
    paths:
      - "librae/**"
      - "examples/**"
      - "tests/packaging/**"
      - "tests/examples/**"
      - "tests/deploy/test_deploy_contract.py"
      - "pyproject.toml"
      - ".github/workflows/package-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: distribution (${{ matrix.os }}, py3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install editable checkout
        run: python -m pip install --editable ".[test]"

      - name: Smoke documented examples
        run: python -m pytest -q tests/examples/test_runnable_examples.py

      - name: Smoke UTF-8 deployment diagnostics
        run: >-
          python -m pytest -q tests/deploy/test_deploy_contract.py
          -k cloud_deploy_refuses_to_sync_an_env_holding_secrets

      - name: Smoke editable install outside checkout
        run: >-
          python -c "import os, runpy, sys, tempfile;
          script=os.path.abspath('tests/packaging/installed_smoke.py');
          os.chdir(tempfile.mkdtemp());
          sys.argv=[script, '--expect-editable'];
          runpy.run_path(script, run_name='__main__')"

      - name: Smoke wheelhouse install without indexes
        run: python tests/packaging/offline_install_smoke.py
