name: package-smoke

on:
  push:
    branches:
      - main
    paths:
      - "librae/**"
      - "tests/packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package-smoke.yml"
  pull_request:
    paths:
      - "librae/**"
      - "tests/packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: distribution (${{ matrix.os }}, py3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install editable checkout
        run: python -m pip install --editable .

      - name: Smoke editable install outside checkout
        run: >-
          python -c "import os, runpy, sys, tempfile;
          script=os.path.abspath('tests/packaging/installed_smoke.py');
          os.chdir(tempfile.mkdtemp());
          sys.argv=[script, '--expect-editable'];
          runpy.run_path(script, run_name='__main__')"

      - name: Smoke wheelhouse install without indexes
        run: python tests/packaging/offline_install_smoke.py
