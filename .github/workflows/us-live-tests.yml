name: us-live-tests

on:
  push:
    paths:
      - "librae/**"
      - "brokers/**"
      - "db/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/conftest.py"
      - ".github/workflows/us-live-tests.yml"
  pull_request:
    paths:
      - "librae/**"
      - "brokers/**"
      - "db/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/conftest.py"
      - ".github/workflows/us-live-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  us-live:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install us-live + test dependencies
        run: uv sync --frozen --python ${{ matrix.python }} --extra us-live --extra test --extra db

      - name: Run us-live tests
        run: uv run --python ${{ matrix.python }} pytest -q -m "us_live" tests/
