apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: P40AE60E18F02DE32
    orgId: 1
    type: grafana-postgresql-datasource
    # WHY: defaults to Docker internal hostname. For local dev connecting
    # to remote VPS, edit this in Grafana UI (Settings → Data Sources)
    # or set VPS_DB_HOST env var before starting Grafana.
    url: quant_timescaledb:5432
    database: quant
    user: quant
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      database: quant
      sslmode: disable
      maxOpenConns: 5
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true
