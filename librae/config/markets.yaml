# Market-level configuration for backtesting.
# Each key is a market identifier used in Backtest(market="crypto").
# Per-instrument details (symbol, min_qty, exchange) belong to the broker layer.
#
# Cost fields:
#   commission_rate  — per-side rate (0.001 = 0.1%)
#   min_commission   — per-side floor in quote currency (0.0 if none)
#   tax_rate         — per-side tax rate (0.00002 = 0.002%)
#   slippage_ticks   — per-side slippage in ticks
#   tick_size        — minimum price increment in quote currency
#   multiplier       — contract multiplier (spot=1.0)

crypto:
  asset_class: crypto
  quote_currency: USDT
  timezone: UTC
  is_24h: true
  commission_rate: 0.001
  min_commission: 0.0
  tax_rate: 0.0
  slippage_ticks: 2
  tick_size: 0.01
  multiplier: 1.0
  long_margin_rate: 1.0
  short_margin_rate: 1.0

tw_futures:
  asset_class: futures
  quote_currency: TWD
  timezone: Asia/Taipei
  is_24h: false
  commission_rate: 0.0
  min_commission: 100.0
  tax_rate: 0.00002
  slippage_ticks: 1
  tick_size: 1.0
  multiplier: 50.0
  long_margin_rate: 0.067
  short_margin_rate: 0.067

us_equity:
  asset_class: equity
  quote_currency: USD
  timezone: America/New_York
  is_24h: false
  commission_rate: 0.0
  min_commission: 0.0
  tax_rate: 0.0
  slippage_ticks: 2
  tick_size: 0.01
  multiplier: 1.0
  long_margin_rate: 1.0
  short_margin_rate: 0.5
