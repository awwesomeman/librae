version: '3.8'
services:
  grafana:
    image: grafana/grafana:latest
    container_name: quant_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../app/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - timescaledb
    restart: unless-stopped
    networks:
      - quant_network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant_timescaledb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=quant
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=quant_secret
    restart: unless-stopped
    networks:
      - quant_network

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: quant-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

networks:
  quant_network:
    driver: bridge

volumes:
  grafana_data:
  timescaledb_data:
  tailscale_data:
