version: '3.8'
services:
  grafana:
    image: grafana/grafana:latest
    container_name: quant_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - timescaledb
    networks:
      - quant_network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant_timescaledb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=quant
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=quant_secret
    restart: unless-stopped
    networks:
      - quant_network

networks:
  quant_network:
    driver: bridge

volumes:
  grafana_data:
  timescaledb_data:
