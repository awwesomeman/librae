version: '3.8'
services:
  grafana:
    image: grafana/grafana:latest
    container_name: quant_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../app/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - timescaledb
    restart: unless-stopped
    networks:
      - quant_network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant_timescaledb
    ports:
      - "${TSDB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=quant
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=quant_secret
    restart: unless-stopped
    networks:
      - quant_network

  sim:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sim
    container_name: quant_sim
    environment:
      - TIMESCALE_DSN=postgresql://quant:quant_secret@timescaledb:5432/quant
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    command: >
      python -m strategies.${SIM_STRATEGY:-trendpullback}.run
      --mode sim
      --symbol ${SIM_SYMBOL:-BTCUSDT}
      --poll-interval ${SIM_POLL_INTERVAL:-60}
    depends_on:
      - timescaledb
    restart: unless-stopped
    networks:
      - quant_network

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: quant-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

networks:
  quant_network:
    driver: bridge

volumes:
  grafana_data:
  timescaledb_data:
  tailscale_data:
