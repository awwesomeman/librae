services:
  grafana:
    env_file: ../.env
    image: grafana/grafana:latest
    container_name: quant_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../app/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - VPS_DB_HOST=${VPS_DB_HOST:-quant_timescaledb}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quant_network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant_timescaledb
    ports:
      - "${TSDB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescale_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    environment:
      - POSTGRES_DB=quant
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quant_secret}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant_network

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: quant-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

networks:
  quant_network:
    name: quant_network
    driver: bridge

volumes:
  grafana_data:
  timescaledb_data:
  tailscale_data:
