# Named volumes below land wherever the host's Docker data-root is
# (`docker info | grep "Docker Root Dir"`, defaults to /var/lib/docker) —
# this file has no way to point them at a specific disk. On a host with
# more than one disk, make sure Docker's data-root is the one with room for
# the DB's growth (set via /etc/docker/daemon.json's "data-root") *before*
# running this compose file — see cloud_deploy.sh's host requirements.
services:
  grafana:
    image: grafana/grafana:13.1.1
    container_name: quant_grafana
    ports:
      - "${GF_BIND:-127.0.0.1}:${GF_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../app/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?POSTGRES_GRAFANA_PASSWORD must be set}
      VPS_DB_HOST: ${VPS_DB_HOST:-quant_timescaledb}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quant_network

  timescaledb:
    image: timescale/timescaledb:2.28.3-pg16
    container_name: quant_timescaledb
    ports:
      - "${TSDB_BIND:-127.0.0.1}:${TSDB_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ../db/timescale_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?POSTGRES_GRAFANA_PASSWORD must be set}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant_network

networks:
  quant_network:
    name: quant_network
    driver: bridge

volumes:
  grafana_data:
  timescaledb_data:
