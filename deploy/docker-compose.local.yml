# Local development: Grafana only, connecting to remote VPS DB.
#
# Prerequisites: copy ../.env.example to ../.env and set VPS_DB_HOST,
# POSTGRES_GRAFANA_PASSWORD, and GF_SECURITY_ADMIN_PASSWORD.
#
# Usage:
#   cd deploy
#   docker compose --env-file ../.env -f docker-compose.local.yml up -d
#
# Then open http://localhost:3000 (admin / password from .env)
# Dashboards auto-refresh every 30 seconds from provisioning directory.
# After running `python -m app.grafana.generate_dashboards`, dashboards
# update automatically — no restart needed.

services:
  grafana:
    image: grafana/grafana:13.1.1
    container_name: quant_grafana_local
    ports:
      - "${GF_BIND:-127.0.0.1}:${GF_PORT:-3000}:3000"
    volumes:
      - grafana_local_data:/var/lib/grafana
      - ../app/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?POSTGRES_GRAFANA_PASSWORD must be set}
      VPS_DB_HOST: ${VPS_DB_HOST:?VPS_DB_HOST must be set}

volumes:
  grafana_local_data:
